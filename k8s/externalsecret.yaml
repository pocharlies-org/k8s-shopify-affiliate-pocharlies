# SKIRM-510 · el secret vivo `affiliate-secrets` pasa a GitOps: lo reconcilia
# external-secrets desde el item 1Password `skirmshop-affiliate` (vault k8s-pocharlies),
# creado por security (Request SKIRM-571, cerrada) con las 19 claves vivas SIN
# SHOPIFY_ACCESS_TOKEN ni SHOPIFY_STORE. Patrón del clúster (labels-secrets):
# ClusterSecretStore onepassword-connect + dataFrom.extract + creationPolicy Owner +
# refreshPolicy OnChange. El nombre del secret NO cambia (lo consumen por envFrom el
# Deployment affiliate-app y el CronJob affiliate-gdpr-prune (affiliate-sync-discounts
# fue borrado en SKIRM-626: usedCount por eventos de pedido).
# metadata.name: "secrets" -> con namePrefix del kustomization ("affiliate-") se
# renderiza como "affiliate-secrets", igual que el secret (convención del clúster:
# ExternalSecret y Secret comparten nombre, cf. labels-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
spec:
  dataFrom:
    - extract:
        key: skirmshop-affiliate
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: affiliate-secrets
