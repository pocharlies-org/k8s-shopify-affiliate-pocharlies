# Skirmshop Affiliate API — Remix + Shopify embedded app
# Public surface: affiliate.skirmshop.es (portal de afiliados + admin embebido)
#                 go.skirmshop.es (redirector de links / tracking)
# DB:    shared postgres  -> /affiliate
# Redis: dedicated affiliate-redis (rate limiting + product cache, efímero)
# Synapse email: shared-rabbitmq vhost /synapse
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affiliate-app
  namespace: skirmshop
spec:
  replicas: 1
  selector: { matchLabels: { app: affiliate-app } }
  template:
    metadata: { labels: { app: affiliate-app } }
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: affiliate-app
          image: harbor.lan.e-dani.com/homelab/shopify-affiliate-app:k8s-20260522-6f3cfe2
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3462, protocol: TCP }
          env:
            - { name: PORT, value: "3462" }
            - { name: NODE_ENV, value: "production" }
            - { name: SHOPIFY_APP_URL, value: "https://affiliate.skirmshop.es" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/affiliate" }
            - { name: REDIS_URL, value: "redis://affiliate-redis.skirmshop.svc.cluster.local:6379" }
            - name: _RMQUSER
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: _RMQPASS
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
            - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
          envFrom: [{ secretRef: { name: affiliate-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3462 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3462 }
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: affiliate-app, namespace: skirmshop }
spec:
  selector: { app: affiliate-app }
  ports: [{ name: http, port: 80, targetPort: 3462 }]
---
# Dedicated Redis (efímero: rate limiting + product cache). Sin persistencia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affiliate-redis
  namespace: skirmshop
spec:
  replicas: 1
  selector: { matchLabels: { app: affiliate-redis } }
  template:
    metadata: { labels: { app: affiliate-redis } }
    spec:
      enableServiceLinks: false
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: affiliate-redis, namespace: skirmshop }
spec:
  selector: { app: affiliate-redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
