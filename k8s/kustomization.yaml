apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Embedded Shopify app on its own domain (affiliate.skirmshop.es) + Redis sidecar.
# Ingress for the custom domain lives at the edge, so the base IngressRoute is dropped.
resources:
  - git@github.com:pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - redis.yaml
  - cronjobs.yaml

namePrefix: affiliate-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: affiliate

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/shopify-affiliate-app
    newTag: k8s-20260522-6f3cfe2

patches:
  - path: deployment-patch.yaml
    target: { kind: Deployment, name: app }
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3462
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 15
          periodSeconds: 10
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 45
          periodSeconds: 20
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: app
