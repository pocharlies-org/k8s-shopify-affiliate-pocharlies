apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Embedded Shopify app on its own domain (affiliate.skirmshop.es) + shared Valkey.
# Ingress for the custom domain lives at the edge, so the base IngressRoute is dropped.
resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - cronjobs.yaml
  - pdb.yaml

namePrefix: affiliate-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: affiliate

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/shopify-affiliate-app
    newTag: v0.5.0

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        # L4: 2 replicas so a single pod OOM/restart/rolling-update no longer takes
        # the whole site down (was 1 replica = 100% downtime on any restart). Session
        # state is replica-safe: Shopify sessions are Prisma/Postgres-backed and the
        # affiliate portal uses stateless JWT cookies. maxUnavailable:0 keeps at least
        # 2 ready during rollouts (see PDB in pdb.yaml).
        replicas: 2
        strategy:
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        template:
          spec:
            imagePullSecrets:
              - name: harbor-pull
            containers:
              - name: app
                command: ["/bin/sh", "-c"]
                args:
                  # The Prisma client is already generated into the image at build
                  # time (Dockerfile builder stage) -> do NOT re-run `prisma generate`
                  # at boot (redundant, slow, adds a registry dependency to startup).
                  # Retry `migrate deploy` instead of fail-fast: a transient edge->
                  # cluster (Tailscale) DB blip at startup used to exit non-zero and
                  # send the pod into CrashLoopBackOff (Prisma P1001). The loop absorbs
                  # transient blips; the startupProbe (~600s budget) covers the window.
                  - |
                    n=0
                    until npx prisma migrate deploy; do
                      n=$((n + 1))
                      echo "[start] prisma migrate deploy failed (db unreachable?) attempt ${n}; retrying in 5s"
                      sleep 5
                    done
                    exec ./node_modules/.bin/remix-serve ./build/server/index.js
                env:
                  - { name: PORT, value: "3462" }
                  # L1 fix: cap the V8 old-space below the cgroup memory limit so
                  # Node GCs hard instead of being OOMKilled (heap grew to 768Mi
                  # over ~12h -> OOMKill -> 502/503 window on restart).
                  - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
                  # The shared framework sets a narrower SCOPES direct env var.
                  # Re-assert affiliate's real scopes so it overrides envFrom.
                  - { name: SCOPES, value: "read_products,read_orders,read_customers,read_discounts,write_discounts" }
                  # Own domain, served at root — no path prefix.
                  - { name: SHOPIFY_APP_URL, value: "https://affiliate.skirmshop.es" }
                  # Short domain for affiliate tracking links (/r/<code>). Code reads
                  # PUBLIC_LINK_DOMAIN at runtime, else falls back to affiliate.skirmshop.es.
                  # Was in sauvage docker .env; dropped in the k8s migration.
                  - { name: PUBLIC_LINK_DOMAIN, value: "go.skirmshop.es" }
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  # connection_limit: sin él Prisma dimensiona el pool con
                  # `cpus_fisicos * 2 + 1` LEIDO DEL HOST, no del límite del
                  # contenedor. Estos pods corren en `sauvage` (48 vCPU, sin cpu
                  # limit) y el framework instancia un PrismaClient además del
                  # de la app → techo x2. Con 2 réplicas, 4 por cliente deja
                  # 8/pod y 16 en total; el rolling update solapa 32.
                  # application_name: trazabilidad en pg_stat_activity.
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/affiliate?connection_limit=4&pool_timeout=15&connect_timeout=10&application_name=affiliate-app" }
                  - name: SHARED_VALKEY_AFFILIATE_PASSWORD
                    valueFrom: { secretKeyRef: { name: affiliate-shared-valkey, key: password } }
                  - { name: REDIS_URL, value: "redis://affiliate:$(SHARED_VALKEY_AFFILIATE_PASSWORD)@shared-valkey-master.databases.svc.cluster.local:6379/0" }
                  - name: _RMQUSER
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
                  - name: _RMQPASS
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
                  - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
                  - { name: S3_ENDPOINT, value: "http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000" }
                  - { name: S3_BUCKET, value: "skirmshop-drive" }
                  - { name: S3_REGION, value: "us-east-1" }
                  - { name: S3_PREFIX, value: "plugins/affiliate" }
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_ACCESS_KEY_ID } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_SECRET_ACCESS_KEY } }
                envFrom:
                  - secretRef: { name: affiliate-secrets }
                resources:
                  # L1 fix: 768Mi limit caused OOMKill ~every 12h. Raise to 1Gi
                  # (buys time until the heap leak is fixed in v0.4.5) and give
                  # guaranteed CPU for the event loop/GC. Deliberately NO cpu
                  # limit: CFS throttling worsens GC pauses on the shared edge node.
                  requests: { cpu: 250m, memory: 256Mi }
                  limits: { memory: 1Gi }
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3462
      # L1 fix: /health does Postgres SELECT 1 + Redis PING sequentially with no
      # per-call timeout. The k8s default probe timeoutSeconds=1 fired under GC
      # stalls / cross-node Tailscale latency -> readiness flap (Traefik 503s) and
      # spurious restarts. Give generous timeouts.
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      # Explicit startupProbe (base defines none). Generous ~600s budget so a slow
      # `prisma migrate deploy` at boot isn't killed by liveness before the app is up.
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 40
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: app
