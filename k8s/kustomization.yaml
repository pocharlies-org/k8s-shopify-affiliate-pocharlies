apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Embedded Shopify app on its own domain (affiliate.skirmshop.es) + Redis sidecar.
# Ingress for the custom domain lives at the edge, so the base IngressRoute is dropped.
resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - redis.yaml
  - cronjobs.yaml

namePrefix: affiliate-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: affiliate

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/shopify-affiliate-app
    newTag: k8s-20260522-6f3cfe2

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: harbor-pull
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3462" }
                  # Own domain, served at root — no path prefix.
                  - { name: SHOPIFY_APP_URL, value: "https://affiliate.skirmshop.es" }
                  # Short domain for affiliate tracking links (/r/<code>). Code reads
                  # PUBLIC_LINK_DOMAIN at runtime, else falls back to affiliate.skirmshop.es.
                  # Was in sauvage docker .env; dropped in the k8s migration.
                  - { name: PUBLIC_LINK_DOMAIN, value: "go.skirmshop.es" }
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/affiliate" }
                  - { name: REDIS_URL, value: "redis://affiliate-redis.skirmshop.svc.cluster.local:6379" }
                  - name: _RMQUSER
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
                  - name: _RMQPASS
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
                  - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
                envFrom:
                  - secretRef: { name: affiliate-secrets }
                resources:
                  requests: { cpu: 50m, memory: 192Mi }
                  limits: { memory: 768Mi }
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3462
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 15
          periodSeconds: 10
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 45
          periodSeconds: 20
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: app
